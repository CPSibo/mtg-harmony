    />
    <script>
      // crypto.randomUUID only exists in secure contexts (HTTPS). Patch it
      // before any module code runs, so libraries that call it still work on a
      // plain-HTTP dev server opened from a phone on the LAN.
      if (
        typeof crypto !== 'undefined' &&
        typeof crypto.randomUUID !== 'function'
      ) {
        crypto.randomUUID = function () {
          var b = new Uint8Array(16);
          crypto.getRandomValues(b);
          b[6] = (b[6] & 15) | 64;
          b[8] = (b[8] & 63) | 128;
          return Array.prototype.map
            .call(b, function (x, i) {
              return (
                ([4, 6, 8, 10].indexOf(i) >= 0 ? '-' : '') +
                x.toString(16).padStart(2, '0')
              );
            })
            .join('');
        };
      }
    </script>
  </head>
  <body>
    <div
      id="app"
      class="isolate"
    ></div>
    <script
      type="module"
      src="/app/main.ts"
    ></script>
